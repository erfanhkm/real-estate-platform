name: Rename preview file to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file and commit
        run: |
          git config user.name "erfanhkm"
          git config user.email "erfanhkm@users.noreply.github.com"
          git mv real-estate-platform-preview.html index.html
          git commit -m "Rename real-estate-platform-preview.html to index.html"
          git push
