# EH REALTY — main site (Render static service).
# Fix SB-0 (F-039): Render does not process the Netlify-style _headers
# file in this repo — response headers become real only when set
# through Render's own mechanism. This blueprint carries the header
# set for the static service. If the live service is not linked to
# this blueprint, mirror the same rules in the Render dashboard
# (Settings -> Headers) instead, and verify with curl afterwards
# (verification commands: packs/FIX-SB0/BUILD-REPORT.md).
# The header set mirrors _headers in this repo; _headers stays as
# the portable record for any future _headers-aware host.
services:
  - type: web
    name: real-estate-platform
    env: static
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=()"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://advisor-api.erfanbillion.workers.dev https://ai-chat.erfanbillion.workers.dev https://seller-api.erfanbillion.workers.dev https://newsletter-signup.erfanbillion.workers.dev https://advisor-academy.erfanbcrealestate.workers.dev https://formsubmit.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self'; manifest-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
      - path: /portal-*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=2592000
      - path: /photos/*
        name: Cache-Control
        value: public, max-age=2592000
      - path: /tours/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /bundle-*
        name: Cache-Control
        value: public, max-age=2592000
