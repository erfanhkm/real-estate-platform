<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Seller Portal — Virtual Tour</title>
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.hidden{display:none!important}
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:32px;width:100%;max-width:440px}
.card h1{font-size:22px;margin-bottom:6px}
.card p{color:#94a3b8;font-size:14px;margin-bottom:20px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:14px;margin-bottom:12px}
button{background:#3b82f6;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer}
button:hover{background:#2563eb}
button.danger{background:#dc2626}
button.ghost{background:#334155}
.err{color:#f87171;font-size:13px;margin-top:8px;min-height:18px}
#app{max-width:900px;margin:0 auto;padding:20px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.sec{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:20px;margin-bottom:16px}
.sec h2{font-size:16px;margin-bottom:12px}
.room{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #334155;font-size:14px}
.room:last-child{border:none}
.room img{width:64px;height:32px;object-fit:cover;border-radius:4px}
.room .nm{flex:1}
#preview{height:320px;border-radius:8px;background:#000;margin-top:12px}
.hint{color:#94a3b8;font-size:13px;margin-top:8px}
.toggle{display:flex;align-items:center;gap:10px;font-size:15px}
.toggle input{width:auto;margin:0;transform:scale(1.4)}
</style>
</head>
<body>
<div id="login">
  <div class="card">
    <h1>Seller Portal</h1>
    <p>Manage your listing's virtual tour.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button onclick="doLogin()">Sign in</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>
<div id="app" class="hidden">
  <div class="topbar">
    <h1>Virtual Tour <span id="listingLbl" style="color:#94a3b8;font-size:14px"></span></h1>
    <button class="ghost" onclick="logout()">Log out</button>
  </div>
  <div class="sec">
    <h2>1. Upload panoramas</h2>
    <input type="file" id="file" accept="image/*">
    <button onclick="upload()">Upload</button>
    <div class="hint">360° panorama photos (phone panorama mode works). Max 15 MB each. Click a room below to place hotspots.</div>
    <div id="rooms"></div>
  </div>
  <div class="sec">
    <h2>2. Tour settings</h2>
    <input id="videoUrl" placeholder="YouTube walkthrough URL (optional)">
    <div class="toggle" style="margin-top:12px"><input type="checkbox" id="enabled"> <label for="enabled">Enable virtual tour on the website</label></div>
    <button style="margin-top:12px" onclick="saveTour()">Save tour</button>
    <div class="err" id="saveErr"></div>
  </div>
  <div class="sec">
    <h2>3. Preview</h2>
    <div id="preview"></div>
  </div>
</div>
<script>
var API='https://seller-api.erfanbillion.workers.dev';
var tour={rooms:[],hotspots:[],enabled:false,videoUrl:''};
var curRoom=null, viewer=null;
function tok(){return sessionStorage.getItem('sel_tok')||'';}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
async function doLogin(){
  var r=await fetch(API+'/api/seller/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('pw').value})});
  var d=await r.json().catch(function(){return{};});
  if(d.ok&&d.token){sessionStorage.setItem('sel_tok',d.token);document.getElementById('listingLbl').textContent='— '+d.listingId;showApp();}
  else{document.getElementById('loginErr').textContent='Invalid email or password.';}
}
function logout(){sessionStorage.removeItem('sel_tok');location.reload();}
function showApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');loadTour();}
function auth(h){h=h||{};h['Authorization']='Bearer '+tok();return h;}
async function loadTour(){
  var r=await fetch(API+'/api/seller/tour',{headers:auth()});
  if(r.status===401){logout();return;}
  var d=await r.json();tour=d.tour||tour;
  document.getElementById('videoUrl').value=tour.videoUrl||'';
  document.getElementById('enabled').checked=!!tour.enabled;
  renderRooms();renderPreview();
}
function renderRooms(){
  var html='';
  tour.rooms.forEach(function(rm){
    html+='<div class="room"><img src="'+esc(rm.url)+'"><span class="nm">'+esc(rm.name)+'</span><button class="ghost" onclick="placeHotspots(\''+rm.id+'\')">Hotspots</button><button class="danger" onclick="delRoom(\''+rm.id+'\')">Delete</button></div>';
  });
  document.getElementById('rooms').innerHTML=html||'<div class="hint">No panoramas yet.</div>';
}
async function upload(){
  var f=document.getElementById('file').files[0];if(!f){alert('Choose an image first.');return;}
  var fd=new FormData();fd.append('file',f);
  var r=await fetch(API+'/api/seller/panorama',{method:'POST',headers:auth(),body:fd});
  var d=await r.json().catch(function(){return{};});
  if(d.ok){
    var name=prompt('Room name:','Room '+(tour.rooms.length+1));if(!name)return;
    tour.rooms.push({id:d.id,name:name,url:d.url});
    renderRooms();renderPreview();
  }else{alert('Upload failed: '+(d.error||'unknown'));}
}
async function delRoom(id){
  if(!confirm('Delete this panorama?'))return;
  await fetch(API+'/api/seller/panorama/'+id,{method:'DELETE',headers:auth()});
  tour.rooms=tour.rooms.filter(function(r){return r.id!==id;});
  tour.hotspots=tour.hotspots.filter(function(h){return h.from!==id&&h.to!==id;});
  renderRooms();renderPreview();
}
function placeHotspots(id){
  curRoom=id;renderPreview();
  alert('Click in the preview to place a hotspot from "'+id+'". Then choose the target room.');
}
function renderPreview(){
  var el=document.getElementById('preview');el.innerHTML='';
  if(!tour.rooms.length){el.innerHTML='<div class="hint" style="padding:40px;text-align:center">Upload a panorama to preview.</div>';return;}
  var rm=tour.rooms[0];
  var hotspots=tour.hotspots.filter(function(h){return h.from===rm.id;}).map(function(h){
    return {pitch:h.pitch,yaw:h.yaw,type:'scene',text:h.text||'',sceneId:h.to};
  });
  var scenes={};
  tour.rooms.forEach(function(r2){
    scenes[r2.id]={title:r2.name,panorama:r2.url,type:'equirectangular',
      hotSpots:tour.hotspots.filter(function(h){return h.from===r2.id;}).map(function(h){return{pitch:h.pitch,yaw:h.yaw,type:'scene',text:h.text||'',sceneId:h.to};})};
  });
  try{
    viewer=pannellum.viewer(el,{default:{firstScene:rm.id,sceneFadeDuration:800},scenes:scenes});
    el.addEventListener('click',function(ev){
      if(!curRoom||!viewer)return;
      try{
        var c=viewer.mouseEventToCoords(ev);
        var to=prompt('Target room id ('+tour.rooms.map(function(r){return r.id;}).join(', ')+'):');
        if(!to)return;
        var txt=prompt('Hotspot label (optional):','');
        tour.hotspots.push({from:curRoom,to:to,yaw:Math.round(c[1]),pitch:Math.round(c[0]),text:txt||''});
        curRoom=null;renderPreview();
      }catch(e){}
    });
  }catch(e){el.innerHTML='<div class="hint">Preview unavailable.</div>';}
}
async function saveTour(){
  tour.videoUrl=document.getElementById('videoUrl').value;
  tour.enabled=document.getElementById('enabled').checked;
  var r=await fetch(API+'/api/seller/tour',{method:'PUT',headers:auth({'Content-Type':'application/json'}),body:JSON.stringify(tour)});
  var d=await r.json().catch(function(){return{};});
  document.getElementById('saveErr').textContent=d.ok?'Saved.':('Save failed: '+(d.error||'unknown'));
  if(d.ok)renderPreview();
}
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
if(tok())showApp();
</script>
</body>
</html>
